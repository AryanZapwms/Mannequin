name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # lets deploy.yml reuse this as a gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # No secrets needed: dbConnect() reads MONGODB_URI at call time, not on
      # import, so route collection succeeds without a database.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_placeholder
          NEXT_PUBLIC_APP_URL: https://mannequincare.in
